      "Structural Change Discipline triggers only for material layout, package, entry-point, build, migration, or broad architecture changes and explicitly excludes normal feature work.",
      "The policy requires current-structure inspection, an intended end-state, canonical and legacy path identification, compatibility analysis, migration risk analysis, and duplicate-concept detection before mutation.",
